name: Build AmethystClient

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AmethystClient
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
          build-root-directory: AmethystClient

      - run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AmethystClient
          path: AmethystClient/build/libs/*.jar
